services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"     # client connections
      - "8222:8222"     # monitoring — the dashboard the client looks at
    # Config file holds max_payload: 8MB (default 1MB) — the response.list
    # reply payload grew past 1MB during Entity Pulse fan-out on 2026-06-02
    # and crashed response-store. Inline flags didn't parse cleanly in
    # docker compose; config file is the safe path.
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    command: ["-c", "/etc/nats/nats.conf"]

  workspace-service:
    build: ./services/workspace
    ports:
      - "3001:3001"
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      SESSION_STORE_PATH: /data/sessions.json
      PORT: "3001"
    volumes:
      - workspace-data:/data

  row-store:
    build: ./services/row-store
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      ROW_STORE_PATH: /data/rows.json
    volumes:
      - row-store-data:/data

  ingest:
    build: ./services/ingest
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222

  xlsx-ingest:
    build: ./services/xlsx-ingest
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222

  prompt-store:
    build: ./services/prompt-store
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      PROMPT_STORE_PATH: /data/prompts.json
    volumes:
      - prompt-store-data:/data

  prompt-runner:
    build: ./services/prompt-runner
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      # The only container that holds the API key. Sourced from
      # augment-it/.env (gitignored; Docker Compose auto-reads it).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Default model when a prompt.run names none. Per-request `model` from
      # request-reviewer overrides this. Override to claude-sonnet-4-6 for
      # cheaper large per-row batches.
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-7}

  response-store:
    build: ./services/response-store
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      RESPONSE_STORE_PATH: /data/responses.json
    volumes:
      - response-store-data:/data

  # Self-hosted metasearch aggregator — the default provider for social packs.
  # No API key, free. Reached by social-search at searxng:8080 on the internal
  # network. The mounted settings.yml enables the JSON API and disables the
  # limiter (both off by default in the upstream image).
  searxng:
    image: searxng/searxng:latest
    environment:
      # Any non-empty string; this instance is internal-only.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-augment-it-local-dev-secret}
    volumes:
      - ./services/social-search/searxng:/etc/searxng:rw
    ports:
      # Exposed for debugging the JSON API directly; not required by the stack.
      - "8080:8080"

  social-search:
    build: ./services/social-search
    depends_on:
      - nats
      - searxng
    environment:
      NATS_URL: nats://nats:4222
      # Default provider for every social pack — no key needed.
      SEARXNG_URL: http://searxng:8080
      # Tavily stays wired in as a peer connector (content-RAG packs). Only
      # packs routed to Tavily need this; sourced from augment-it/.env.
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      # Firecrawl — used by the Records Surface (firecrawl-nav-scan,
      # firecrawl-nav-agent) and by the Entity Pulse official-blog-pack.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      # SerpApi — used by the Records Surface (serpapi-site-search) and by
      # the Entity Pulse official-blog-pack's find-index stage.
      # The repo .env keeps this as SERP_API_KEY (historical name with an
      # underscore between SERP and API); the container code reads
      # SERPAPI_API_KEY, so we map either spelling through here.
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-${SERP_API_KEY:-}}
      # Anthropic — used by the firecrawl-nav-agent connector to classify
      # nav links via Haiku. Falls back to deterministic nav-scan when unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Cap concurrent search calls — the Tavily free tier is rate-limited, and
      # bursting SearXNG can trip upstream-engine throttling.
      SOCIAL_SEARCH_CONCURRENCY: ${SOCIAL_SEARCH_CONCURRENCY:-4}

volumes:
  workspace-data:
  row-store-data:
  prompt-store-data:
  response-store-data:

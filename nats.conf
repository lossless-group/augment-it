# nats-server config for augment-it dev stack.
#
# max_payload bumped to 8MB (default 1MB) — response.list reply payload
# grows past 1MB when the by-record view loads N responses with structured
# candidate JSON. Hit 2026-06-02 during Entity Pulse fan-out crash.
#
# Bumped again to 48MB (2026-06-29) — source.attach carries an operator-
# uploaded report PDF as base64 over NATS (browser→workspace→content-ingest).
# A 28.5MB PDF base64s to ~38MB; 48MB leaves headroom. content-ingest then
# Ghostscript-compresses it on receipt so the STORED file stays small — the
# fat payload is transient, only on the wire.

port: 4222
http_port: 8222
max_payload: 48MB

jetstream {
  store_dir: "/data/jetstream"
}

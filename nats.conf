# nats-server config for augment-it dev stack.
#
# max_payload bumped to 8MB (default 1MB) — response.list reply payload
# grows past 1MB when the by-record view loads N responses with structured
# candidate JSON. Hit 2026-06-02 during Entity Pulse fan-out crash.

port: 4222
http_port: 8222
max_payload: 8MB

jetstream {
  store_dir: "/data/jetstream"
}
